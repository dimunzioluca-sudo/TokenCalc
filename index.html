<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calcolatrice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5" style="max-width: 400px;">
    <div class="card p-4 shadow-sm">
      <h3 class="mb-3 text-center">Calcolatrice</h3>

      <div class="mb-3">
        <label for="num1" class="form-label">Primo numero</label>
        <input type="number" class="form-control" id="num1" placeholder="Es. 10">
      </div>

      <div class="mb-3">
        <label for="num2" class="form-label">Secondo numero</label>
        <input type="number" class="form-control" id="num2" placeholder="Es. 5">
      </div>

      <div class="d-flex gap-2 mb-3">
        <button class="btn btn-primary w-100" onclick="calcola('+')">Somma (+)</button>
        <button class="btn btn-secondary w-100" onclick="calcola('-')">Sottrai (-)</button>
      </div>

      <div class="alert alert-info text-center mb-0">
        Risultato: <strong id="risultato">0</strong>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
