<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Calcolatrice</title>
</head>
<body>

  <input type="number" id="num1" placeholder="Primo numero">
  <input type="number" id="num2" placeholder="Secondo numero">

  <button onclick="calcola('+')">+</button>
  <button onclick="calcola('-')">-</button>

  <p>Risultato: <span id="risultato">0</span></p>

  <script>
    function calcola(operazione) {
      const n1 = parseFloat(document.getElementById('num1').value) || 0;
      const n2 = parseFloat(document.getElementById('num2').value) || 0;
      
      const res = operazione === '+' ? n1 + n2 : n1 - n2;
      
      document.getElementById('risultato').textContent = res;
    }
  </script>

</body>
</html>
